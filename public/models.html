<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark light">
<title>Models — Meridian</title>
<link rel="stylesheet" href="/css/tokens.css">
<link rel="stylesheet" href="/css/layout.css">
<link rel="stylesheet" href="/css/components.css">
<link rel="stylesheet" href="/css/extraction.css">
<link rel="stylesheet" href="/css/print.css">
<script type="module" src="/js/models.js"></script>
</head>
<body>
<div class="shell">

  <aside class="rail no-print">
    <div class="rail__brand"><span class="wordmark">Meridian</span></div>

    <nav class="rail__group" aria-label="Primary">
      <div class="rail__eyebrow t-label">Workspace</div>
      <a class="nav-item" href="/app#/deals" id="nav-deals">Deals</a>
      <a class="nav-item" href="#/" id="nav-models" aria-current="page">Models</a>
    </nav>

    <div class="rail__foot">
      <div class="stack stack--8">
        <div class="t-micro c-3" id="rail-org"></div>
        <div class="t-caption c-2 u-truncate" id="rail-user"></div>
        <button class="btn btn--ghost btn--sm" type="button" id="sign-out">Sign out</button>
      </div>
    </div>
  </aside>

  <main class="canvas" id="canvas">
    <div class="page" id="view">
      <div class="page-head">
        <div class="page-head__id">
          <span class="t-label c-3">Meridian</span>
          <h1 class="t-display-m">Loading</h1>
        </div>
      </div>
    </div>
  </main>

</div>
</body>
</html>
