<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark light">
<title>Deals — Meridian</title>
<link rel="stylesheet" href="/css/tokens.css?v=4">
<link rel="stylesheet" href="/css/layout.css?v=4">
<link rel="stylesheet" href="/css/components.css?v=4">
<link rel="stylesheet" href="/css/extraction.css?v=4">
<link rel="stylesheet" href="/css/features.css?v=4">
<link rel="stylesheet" href="/css/print.css?v=4">
<script type="module" src="/js/app.js?v=4"></script>
</head>
<body>
<div class="shell">

  <aside class="rail no-print">
    <div class="rail__brand"><span class="wordmark">Meridian</span></div>

    <nav class="rail__group" aria-label="Primary">
      <div class="rail__eyebrow t-label">Workspace</div>
      <a class="nav-item" href="#/deals" id="nav-deals">
        <span class="visually-hidden">Go to </span>Deals
        <span class="nav-item__count" id="nav-deal-count"></span>
      </a>
      <a class="nav-item" href="/models" id="nav-models">Models</a>
    </nav>

    <div class="rail__group" id="rail-context" hidden></div>

    <div class="rail__foot">
      <div class="stack stack--8">
        <div class="t-micro c-3" id="rail-org"></div>
        <div class="t-caption c-2 u-truncate" id="rail-user"></div>
        <button class="btn btn--ghost btn--sm" type="button" id="sign-out">Sign out</button>
      </div>
    </div>
  </aside>

  <main class="canvas" id="canvas">
    <div class="page" id="view">
      <div class="page-head">
        <div class="page-head__id">
          <span class="t-label c-3">Meridian</span>
          <h1 class="t-display-m">Loading</h1>
        </div>
      </div>
    </div>
  </main>

</div>
</body>
</html>
